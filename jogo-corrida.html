<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Bom Mensageiro: Beta 2.0</title>
    <style>
        body { 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background: #333; 
        }

        #jogo { 
            width: 800px; 
            height: 400px; 
            background-image: url('cenariobeta.jpg'); 
            background-size: cover; 
            background-position: bottom;
            position: relative; 
            overflow: hidden; 
            border: 4px solid #000; 
        }

        /* Ajuste do Personagem */
        #personagem {
            position: absolute;
            bottom: 50px; /* Ajuste aqui para ele subir ou descer em relação ao chão */
            left: 50px;
            width: 100px; /* Ajuste o tamanho aqui sem deformar */
            height: auto; /* Mantém a proporção real da imagem */
        }

        /* Ajuste da Ampulheta */
        #ampulheta {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px;
        }
    </style>
</head>
<body>

    <div id="jogo">
        <img id="personagem" src="jogadorbeta.png" alt="Mensageiro">
        <img id="ampulheta" src="ampulhetabeta.png" alt="Tempo">
    </div>

</body>
</html>

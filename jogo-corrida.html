<!DOCTYPE html>
<html>
<head>
    <style>
        #jogo { position: relative; width: 800px; height: 400px; overflow: hidden; background: #f0f0f0; border: 2px solid #000; }
        
        /* Animação de entrada do Relógio */
        @keyframes puloVilao {
            0% { left: -200px; }
            50% { left: 350px; }
            100% { left: 900px; }
        }
        .animar-vilao { animation: puloVilao 4s ease-in-out forwards; }
        
        /* Balão de Fala */
        #balaoFala { 
            position: absolute; top: -60px; left: 0; background: white; 
            padding: 10px; border: 3px solid black; border-radius: 15px; 
            font-family: sans-serif; z-index: 101; 
        }
    </style>
</head>
<body>

<div id="jogo">
    <div id="containerChefao" style="display: none; position: absolute; top: 150px; z-index: 100;">
        <img id="imgRelogio" src="relogiobeta.png" style="width: 150px;">
        <div id="balaoFala">
            <span id="textoRelogio"></span>
        </div>
    </div>
</div>

<script>
    let jogoAtivo = true;
    let segundosPassados = 0;
    let integridadeRelogio = 3; // 3: Completo, 2: 1 badalo, 1: 0 badalos, 0: Desmontado

    // Padrão de ondas: 1, 1, 2, 1, 1, 2...
    const padraoOndas = [1, 1, 2, 1, 1, 2, 1, 1, 1, 1, 2, 1, 1, 1, 1, 2];
    let indiceOnda = 0;

    function lançarAmpulhetas() {
        if (!jogoAtivo) return;
        let quantidade = padraoOndas[indiceOnda];
        for(let i = 0; i < quantidade; i++) {
            let amp = document.createElement('img');
            amp.src = 'ampulhetabeta.png';
            amp.className = 'ampulheta-ativa';
            amp.style.position = 'absolute'; amp.style.bottom = '80px';
            amp.style.right = (i * 150) + 'px'; amp.style.width = '50px';
            document.getElementById('jogo').appendChild(amp);
            setTimeout(() => amp.remove(), 2000);
        }
        indiceOnda = (indiceOnda + 1) % padraoOndas.length;
    }

    function iniciarSequenciaChefao() {
        jogoAtivo = false;
        document.querySelectorAll('.ampulheta-ativa').forEach(a => a.remove());

        const container = document.getElementById('containerChefao');
        const texto = document.getElementById('textoRelogio');
        
        // Define texto e estado
        if (integridadeRelogio === 3) texto.innerText = "O tempo é meu, mensageiro!";
        else if (integridadeRelogio === 2) texto.innerText = "Perdeu um badalo!";
        else if (integridadeRelogio === 1) texto.innerText = "Já era...!";

        container.style.display = 'block';
        container.classList.add('animar-vilao');
        
        setTimeout(() => {
            container.style.display = 'none';
            container.classList.remove('animar-vilao');
            integridadeRelogio--;
            
            if (integridadeRelogio === 0) {
                alert("Vitória! O Relógio se desmontou! Você ganhou as BOTAS!");
            } else {
                jogoAtivo = true;
            }
        }, 4000);
    }

    // Cronômetro principal
    setInterval(() => {
        if (!jogoAtivo) return;
        segundosPassados++;
        // Gatilhos: 240s (4min), 480s (8min), 660s (11min)
        if (segundosPassados === 240 || segundosPassados === 480 || segundosPassados === 660) {
            iniciarSequenciaChefao();
        }
    }, 1000);

    setInterval(lançarAmpulhetas, 2500);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Bom Mensageiro: Beta 2.0</title>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #333; }
        #jogo { width: 800px; height: 400px; background: url('assets/cenariobeta.jpg'); background-size: cover; position: relative; overflow: hidden; border: 4px solid #000; }
        #mascote { width: 80px; height: 80px; position: absolute; bottom: 0; left: 50px; background: url('assets/jogadorbeta.png') no-repeat; background-size: contain; }
        #obstaculo { width: 50px; height: 50px; position: absolute; bottom: 0; right: -50px; background: url('assets/ampulhetabeta.png') no-repeat; background-size: contain; }
        
        /* A animação só será aplicada via JS depois do "GO!" */
        .mover { animation: moverObstaculo 2s infinite linear; }
        @keyframes moverObstaculo { 0% { right: -50px; } 100% { right: 850px; } }
        
        #placar { font-size: 50px; text-align: center; color: white; position: absolute; width: 100%; top: 40%; font-family: sans-serif; text-shadow: 2px 2px #000; z-index: 10; }
        .pular { animation: pulo 0.6s linear; }
        @keyframes pulo { 0% { bottom: 0; } 30% { bottom: 150px; } 70% { bottom: 150px; } 100% { bottom: 0; } }
    </style>
</head>
<body>
    <div id="jogo">
        <div id="placar">3</div>
        <div id="mascote"></div>
        <div id="obstaculo"></div>
    </div>
    <script>
        const mascote = document.getElementById('mascote');
        const obstaculo = document.getElementById('obstaculo');
        const placar = document.getElementById('placar');
        
        let jogoAtivo = false; // Bloqueia a colisão até o jogo começar

        let tempo = 3;
        let contagem = setInterval(() => {
            tempo--;
            if(tempo > 0) { placar.innerText = tempo; }
            else if (tempo === 0) { placar.innerText = "GO!"; }
            else {
                placar.innerText = "";
                clearInterval(contagem);
                jogoAtivo = true; // Libera o jogo
                obstaculo.classList.add('mover'); // Inicia a animação da ampulheta
            }
        }, 1000);

        document.addEventListener('keydown', () => {
            if(!mascote.classList.contains('pular')) {
                mascote.classList.add('pular');
                setTimeout(() => { mascote.classList.remove('pular'); }, 600);
            }
        });

        let verificarColisao = setInterval(() => {
            if (!jogoAtivo) return; // Não verifica se o jogo ainda não começou

            let mascoteBottom = parseInt(window.getComputedStyle(mascote).getPropertyValue("bottom"));
            let obstaculoRight = parseInt(window.getComputedStyle(obstaculo).getPropertyValue("right"));
            
            if (obstaculoRight > 650 && obstaculoRight < 750 && mascoteBottom < 50) {
                alert("Game Over! O tempo parou.");
                location.reload();
            }
        }, 10);
    </script>
</body>
</html>

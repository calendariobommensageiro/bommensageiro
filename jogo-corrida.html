<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Bom Mensageiro: Beta 2.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; background: #333; font-family: 'Luckiest Guy', sans-serif; }
        #jogo { width: 800px; height: 400px; background: url('cenariobeta.jpg') no-repeat center center; background-size: cover; position: relative; overflow: hidden; border: 4px solid #000; }
        
        /* Container do Chefão Corrigido */
        #containerChefao { 
            display: none; position: absolute; bottom: 80px; left: 350px; z-index: 50; 
            flex-direction: column; align-items: center;
        }
        #containerChefao img { background: transparent !important; border: none !important; }
        #balaoFala { background: white; padding: 10px; border: 3px solid black; border-radius: 15px; text-align: center; margin-bottom: 5px; }
        
        #personagem { position: absolute; bottom: 70px; left: 50px; width: 100px; z-index: 2; }
        #ampulheta { position: absolute; bottom: 80px; right: -50px; width: 50px; z-index: 1; }
        .pular { animation: pulo 0.6s linear; }
        @keyframes pulo { 0% { bottom: 80px; } 30% { bottom: 200px; } 70% { bottom: 200px; } 100% { bottom: 80px; } }
        .mover-ampulheta { animation: mover 2s infinite linear; }
        @keyframes mover { 0% { right: -50px; } 100% { right: 850px; } }
    </style>
</head>
<body>

    <div id="jogo">
        <img id="personagem" src="jogadorbeta.png">
        <img id="ampulheta" src="ampulhetabeta.png">
        
        <div id="containerChefao">
            <div id="balaoFala"><span id="textoRelogio"></span></div>
            <img src="relogiobeta.png" style="width: 120px;">
        </div>
    </div>

    <script>
        let faseChefao = 1;
        let jogoAtivo = false;
        const containerChefao = document.getElementById('containerChefao');
        const textoRelogio = document.getElementById('textoRelogio');

        function ativarChefao() {
            containerChefao.style.display = 'flex';
            
            // Frases dinâmicas
            if (faseChefao === 1) textoRelogio.innerText = "O tempo é um ciclo!";
            else if (faseChefao === 2) textoRelogio.innerText = "Você está exausto!";
            else textoRelogio.innerText = "Meu mecanismo caiu!";

            // O chefão aparece por 4 segundos e vai embora sem parar o jogo
            setTimeout(() => {
                containerChefao.style.display = 'none';
                if (faseChefao === 3) {
                    alert("Você ganhou as BOTAS! Pressione SETA PARA BAIXO para agachar.");
                }
                faseChefao++;
            }, 4000);
        }

        // --- GATILHOS DE TEMPO ---

        }
    </script>
</body>
</html>

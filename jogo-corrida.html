<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #333; }
        
        #jogo { 
            position: relative; width: 800px; height: 400px; 
            background: #e0e0e0; border: 4px solid #000; overflow: hidden; 
        }

        /* Container do Vilão - Centralizado */
        #containerChefao { 
            position: absolute; top: 80px; left: -300px; /* Fora da tela inicialmente */
            display: flex; flex-direction: column; align-items: center; z-index: 100;
        }

        /* Balão de fala estilo HQ */
        #balaoFala { 
            background: white; padding: 15px; border: 3px solid #000; 
            border-radius: 20px; font-family: 'Arial', sans-serif; 
            font-weight: bold; margin-bottom: 10px; text-align: center;
        }

        /* Animação de entrada */
        .animar-vilao { animation: entrarTela 6s forwards; }
        @keyframes entrarTela {
            0% { left: -300px; }
            40% { left: 300px; } /* Para no centro */
            80% { left: 300px; } /* Pausa para falar */
            100% { left: 900px; } /* Sai da tela */
        }
    </style>
</head>
<body>

<div id="jogo">
    <!-- Relógio Beta e Fala -->
    <div id="containerChefao">
        <div id="balaoFala"><span id="textoRelogio"></span></div>
        <img src="relogiobeta.png" style="width: 150px;">
    </div>
</div>

<script>
    let integridadeRelogio = 3;
    const container = document.getElementById('containerChefao');
    const texto = document.getElementById('textoRelogio');

    function acionarVilao() {
        // Define a fala baseada na vida
        if (integridadeRelogio === 3) texto.innerText = "Tic-Tac! O tempo é meu!";
        else if (integridadeRelogio === 2) texto.innerText = "Um badalo a menos!";
        else texto.innerText = "A sua era termina aqui!";

        container.classList.add('animar-vilao');

        // Após a animação, reseta
        setTimeout(() => {
            container.classList.remove('animar-vilao');
            integridadeRelogio--;
            if (integridadeRelogio === 0) alert("Relógio desmontado! Pegue as BOTAS!");
        }, 6000);
    }

    // Gatilho para teste: clica na tela para chamar o vilão
    document.getElementById('jogo').addEventListener('click', acionarVilao);
</script>
</body>
</html>

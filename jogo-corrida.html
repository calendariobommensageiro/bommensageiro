<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Corrida do Bom Mensageiro</title>
    <style>
        * { padding: 0; margin: 0; box-sizing: border-box; }
        body { background: #f0f0f0; font-family: sans-serif; overflow: hidden; text-align: center; user-select: none; }
        #jogo { width: 100%; max-width: 600px; height: 300px; background: #e0f7fa; margin: 20px auto; border-bottom: 5px solid #4caf50; position: relative; overflow: hidden; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        #mascote { width: 40px; height: 50px; background: #0066cc; position: absolute; bottom: 0; left: 50px; border-radius: 4px; font-size: 25px; display: flex; align-items: center; justify-content: center; }
        .pulo { animation: pular 0.6s linear; }
        #obstaculo { width: 30px; height: 30px; background: #ff5722; position: absolute; bottom: 0; right: -30px; border-radius: 50px; font-size: 18px; display: flex; align-items: center; justify-content: center; }
        .correr { animation: moverObstaculo 1.5s infinite linear; }
        #placar { font-size: 24px; font-weight: bold; margin-top: 10px; color: #333; }
        #aviso { font-size: 14px; color: #666; margin-top: 5px; }
        #btn-reiniciar { display: none; margin: 15px auto; padding: 10px 20px; font-size: 16px; background: #4caf50; color: white; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; }
        @keyframes pular { 
            0%, 100% { bottom: 0; } 
            50% { bottom: 100px; } 
        }
        @keyframes moverObstaculo { 
            0% { right: -30px; } 
            100% { right: 100%; } 
        }
    </style>
</head>
<body>

    <h2 style="margin-top: 20px; color: #0066cc;">🏃‍♂️ Corrida do Bom Mensageiro</h2>
    <div id="placar">Pontos: 0</div>
    <div id="aviso">Toque na tela ou aperte ESPAÇO para pular!</div>

    <div id="jogo" id="area-jogo">
        <div id="mascote">🏃‍♂️</div>
        <div id="obstaculo" class="correr">⏰</div>
    </div>

    <button id="btn-reiniciar" onclick="reiniciarJogo()">Jogar Novamente</button>
    
    <p style="margin-top: 20px;"><a href="index.html" style="color: #0066cc; text-decoration: none; font-weight: bold;">← Voltar para o Site</a></p>

    <script>
        const mascote = document.getElementById("mascote");
        const obstaculo = document.getElementById("obstaculo");
        const placar = document.getElementById("placar");
        const btnReiniciar = document.getElementById("btn-reiniciar");
        let pontos = 0;
        let vivo = true;

        // Comando para Pular
        function pular() {
            if (!mascote.classList.contains("pulo") && vivo) {
                mascote.classList.add("pulo");
                setTimeout(() => { mascote.classList.remove("pulo"); }, 600);
                if(vivo) { pontos++; placar.innerText = "Pontos: " + pontos; }
            }
        }

        // Detectar teclado ou toque no celular
        document.addEventListener("keydown", (e) => { if (e.code === "Space") pular(); });
        document.getElementById("jogo").addEventListener("touchstart", pular);

        // Checar colisão (Game Over)
        const checarColisao = setInterval(() => {
            const mascoteBottom = parseInt(window.getComputedStyle(mascote).getPropertyValue("bottom"));
            const obstaculoLeft = parseInt(window.getComputedStyle(obstaculo).getPropertyValue("left"));

            // Se o obstáculo bater no jogador
            if (obstaculoLeft > 50 && obstaculoLeft < 90 && mascoteBottom <= 30) {
                vivo = false;
                obstaculo.classList.remove("correr");
                obstaculo.style.left = obstaculoLeft + "px";
                placar.innerText = "Fim de Jogo! Pontos finais: " + pontos;
                btnReiniciar.style.display = "block";
            }
        }, 10);

        function reiniciarJogo() {
            window.location.reload();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Bom Mensageiro: Beta 2.0</title>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #333; }
        
        #jogo { 
            width: 800px; 
            height: 400px; 
            background: url('cenariobeta.jpg'); 
            background-size: cover; 
            background-position: center;
            position: relative; 
            overflow: hidden; 
            border: 4px solid #000; 
        }

        #personagem {
            position: absolute;
            bottom: 120px; 
            left: 50px;
            width: 100px;
        }

        #ampulheta {
            position: absolute;
            bottom: 80px; 
            right: -50px; /* Começa fora da tela para entrar na animação */
            width: 50px;
        }

        /* Animações */
        .pular { animation: pulo 0.6s linear; }
        @keyframes pulo { 0% { bottom: 120px; } 30% { bottom: 250px; } 70% { bottom: 250px; } 100% { bottom: 120px; } }

        .mover-ampulheta { animation: mover 2s infinite linear; }
        @keyframes mover { 0% { right: -50px; } 100% { right: 850px; } }
    </style>
</head>
<body>
    <div id="jogo">
        <img id="personagem" src="jogadorbeta.png" alt="Mensageiro">
        <img id="ampulheta" src="ampulhetabeta.png" class="mover-ampulheta" alt="Tempo">
    </div>

    <script>
        const personagem = document.getElementById('personagem');

        // Lógica do Pulo
        document.addEventListener('keydown', (event) => {
            if (event.code === 'Space' || event.code === 'ArrowUp') {
                if (!personagem.classList.contains('pular')) {
                    personagem.classList.add('pular');
                    setTimeout(() => { personagem.classList.remove('pular'); }, 600);
                }
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bom Mensageiro</title>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Luckiest Guy', cursive; }
        
        #jogo { 
            width: 100vw; height: 100vh; 
            background: url('cenariobeta.jpg') no-repeat center center; 
            background-size: cover; 
            position: relative; overflow: hidden; 
        }

        #painel { position: absolute; top: 20px; left: 20px; color: #fff; font-size: 2rem; z-index: 10; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 10px; }
        
        #personagem { position: absolute; bottom: 10%; left: 5%; width: 10%; z-index: 2; }
        .ampulheta { position: absolute; bottom: 10%; width: 8%; z-index: 1; }
        
        #chefe { position: absolute; bottom: 10%; right: 5%; width: 15%; display: none; z-index: 3; }
        #balao { position: absolute; top: 20%; right: 5%; background: white; padding: 20px; border: 4px solid black; display: none; z-index: 4; font-size: 1.5rem; }

        #gameOver { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); color: white; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 20; }
        
        #btnStart { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 30px 60px; font-size: 3rem; cursor: pointer; z-index: 20; font-family: 'Luckiest Guy', cursive; }

        .pulo { animation: pulo 0.6s linear; }
        @keyframes pulo { 0% { bottom: 10%; } 40% { bottom: 40%; } 100% { bottom: 10%; } }
    </style>
</head>
<body>

    <div id="jogo">
        <div id="painel">Tempo: <span id="crono">12:00</span> | Pontos: <span id="pts">0</span></div>
        <img id="personagem" src="jogadorbeta.png">
        <div id="balao">Como se atreve me enfrentar?</div>
        <img id="chefe" src="relogiobeta.png">
        <div id="gameOver"><h1>GAME OVER</h1><button onclick="location.reload()">TENTAR NOVAMENTE</button></div>
        <button id="btnStart">START</button>
    </div>

    <script>
        const p = document.getElementById('personagem'), btn = document.getElementById('btnStart'), chefe = document.getElementById('chefe'), balao = document.getElementById('balao'), crono = document.getElementById('crono'), pts = document.getElementById('pts');
        let ativo = false, seg = 0, pontos = 0;

        btn.onclick = () => {
            btn.style.display = 'none';
            chefe.style.display = 'block'; balao.style.display = 'block';
            setTimeout(() => {
                chefe.style.display = 'none'; balao.style.display = 'none';
                ativo = true; iniciarJogo();
            }, 3000);
        };

        function iniciarJogo() {
            setInterval(() => {
                if(ativo) {
                    seg++; pontos += 10;
                    pts.innerText = pontos;
                    let t = 720 - seg;
                    crono.innerText = Math.floor(t/60) + ":" + (t%60).toString().padStart(2, '0');
                    if(seg === 240 || seg === 480 || seg === 660) confronto();
                }
            }, 1000);
            gerar();
        }

        function confronto() {
            ativo = false; chefe.style.display = 'block'; balao.innerText = "TENTE ME SUPERAR!"; balao.style.display = 'block';
            setTimeout(() => { chefe.style.display = 'none'; balao.style.display = 'none'; ativo = true; }, 5000);
        }

        function gerar() {
            if(!ativo) { setTimeout(gerar, 1000); return; }
            let a = document.createElement('img');
            a.src = 'ampulhetabeta.png'; a.className = 'ampulheta'; a.style.left = '100%';
            document.getElementById('jogo').appendChild(a);
            let pos = 100;
            let m = setInterval(() => {
                if(!ativo) return;
                pos -= 0.5; a.style.left = pos + '%';
                if(pos < 12 && pos > 5 && !p.classList.contains('pulo')) { ativo = false; document.getElementById('gameOver').style.display = 'flex'; clearInterval(m); }
                if(pos < -10) { clearInterval(m); a.remove(); }
            }, 20);
            setTimeout(gerar, 2000);
        }

        document.addEventListener('touchstart', () => p.classList.add('pulo'));
        document.addEventListener('animationend', () => p.classList.remove('pulo'));
        document.addEventListener('keydown', (e) => { if(e.code === 'Space') p.classList.add('pulo'); });
    </script>
</body>
</html>

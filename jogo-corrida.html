<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Bom Mensageiro: Beta Final</title>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; background: #333; font-family: sans-serif; }
        
        #ui { color: white; font-size: 20px; margin-bottom: 10px; font-weight: bold; }
        
        #jogo { 
            width: 800px; height: 400px; 
            background: url('cenariobeta.jpg') no-repeat center center; 
            background-size: cover; 
            position: relative; overflow: hidden; border: 4px solid #000; 
        }

        #personagem { position: absolute; bottom: 70px; left: 50px; width: 100px; z-index: 2; }
        #ampulheta { position: absolute; bottom: 80px; right: -50px; width: 50px; z-index: 1; }

        .tela-jogo { font-family: 'Luckiest Guy', cursive; text-shadow: 3px 3px 0 #000; }
        .pular { animation: pulo 0.6s linear; }
        @keyframes pulo { 0% { bottom: 70px; } 50% { bottom: 200px; } 100% { bottom: 70px; } }
        .mover-ampulheta { animation: mover 2s infinite linear; }
        @keyframes mover { 0% { right: -50px; } 100% { right: 850px; } }
    </style>
</head>
<body>

    <div id="ui">Tempo: <span id="tempo">12:00</span> | Pontos: <span id="pontos">0</span></div>
    
    <div id="jogo">
        <img id="personagem" src="jogadorbeta.png" alt="Mensageiro">
        <img id="ampulheta" src="ampulhetabeta.png" alt="Tempo">
        
        <div id="countDownScreen" class="tela-jogo" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); color: #FFD700; display: none; justify-content: center; align-items: center; z-index: 99; font-size: 100px;">
            <span id="countText">3</span>
        </div>

        <div id="gameOverScreen" class="tela-jogo" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 0, 0, 0.8); color: white; flex-direction: column; justify-content: center; align-items: center; z-index: 100; font-size: 50px;">
            <h1>GAME OVER!</h1>
            <button onclick="location.reload()" style="font-family: 'Luckiest Guy', cursive; padding: 15px 30px; cursor: pointer; font-size: 24px; background: #FFD700; border: none; border-radius: 10px;">TENTAR DE NOVO</button>
        </div>
    </div>

    <button id="btnStart" onclick="iniciarJogo()" style="margin-top: 15px; padding: 10px 30px; cursor: pointer; font-size: 16px;">START</button>

    <script>
        const personagem = document.getElementById('personagem');
        const ampulheta = document.getElementById('ampulheta');
        const tempoDisplay = document.getElementById('tempo');
        const pontosDisplay = document.getElementById('pontos');
        const btnStart = document.getElementById('btnStart');
        const countScreen = document.getElementById('countDownScreen');
        const countText = document.getElementById('countText');
        
        let jogoAtivo = false;
        let segundos = 720;
        let pontuacao = 0;
        let cronometro, colisor;

        function iniciarJogo() {
            if (jogoAtivo) return;
            btnStart.style.display = 'none';
            countScreen.style.display = 'flex';
            let contagem = 3;
            let interval = setInterval(() => {
                contagem--;
                if (contagem > 0) countText.innerText = contagem;
                else if (contagem === 0) countText.innerText = "GO!";
                else {
                    clearInterval(interval);
                    countScreen.style.display = 'none';
                    iniciarCronometroJogo();
                }
            }, 1000);
        }

        function iniciarCronometroJogo() {
            jogoAtivo = true;
            ampulheta.classList.add('mover-ampulheta');
            cronometro = setInterval(() => {
                segundos--;
                let m = Math.floor(segundos / 60);
                let s = segundos % 60;
                tempoDisplay.innerText = `${m}:${s < 10 ? '0'+s : s}`;
                if (segundos <= 0) location.reload();
            }, 1000);

            colisor = setInterval(() => {
                if (!jogoAtivo) return;
                let c = personagem.getBoundingClientRect();
                let a = ampulheta.getBoundingClientRect();
                if (c.right > a.left + 20 && c.left < a.right - 20 && c.bottom > a.top + 20) {
                    jogoAtivo = false;
                    clearInterval(cronometro);
                    clearInterval(colisor);
                    ampulheta.style.animationPlayState = 'paused';
                    document.getElementById('gameOverScreen').style.display = 'flex';
                }
            }, 50);
        }

        document.addEventListener('keydown', (e) => {
            if ((e.code === 'Space' || e.code === 'ArrowUp') && jogoAtivo && !personagem.classList.contains('pular')) {
                personagem.classList.add('pular');
                pontuacao += 10;
                pontosDisplay.innerText = pontuacao;
                setTimeout(() => personagem.classList.remove('pular'), 600);
            }
        });
    </script>
</body>
</html>

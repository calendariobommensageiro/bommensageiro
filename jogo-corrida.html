<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Bom Mensageiro: Beta 2.0</title>
    <style>
        body { 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background: #333; 
        }

       #jogo { 
    width: 800px; 
    height: 400px; 
    background-image: url('cenariobeta.jpg'); 
    /* 'cover' faz a imagem preencher todo o espaço sem deixar buracos */
    background-size: cover; 
    /* Centraliza a imagem para não cortar partes importantes */
    background-position: center;
    position: relative; 
    overflow: hidden; 
    border: 4px solid #000; 
}

        /* Ajuste do Personagem */
        #personagem {
            position: absolute;
            bottom: 50px; /* Ajuste aqui para ele subir ou descer em relação ao chão */
            left: 50px;
            width: 100px; /* Ajuste o tamanho aqui sem deformar */
            height: auto; /* Mantém a proporção real da imagem */
        }

        #ampulheta {
    position: absolute;
    bottom: 80px; /* Alinha com a altura do personagem na estrada */
    right: 50px;   /* Distância da direita */
    width: 50px;
}
        
    </style>
</head>
<body>

    <div id="jogo">
        <img id="personagem" src="jogadorbeta.png" alt="Mensageiro">
        <img id="ampulheta" src="ampulhetabeta.png" alt="Tempo">
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Bom Mensageiro: Beta 2.0</title>
    <style>
        body { margin: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; background: #333; font-family: sans-serif; }
        
        #ui { color: white; font-size: 20px; margin-bottom: 10px; font-weight: bold; }
        
        #jogo { 
            width: 800px; 
            height: 400px; 
            background: url('cenariobeta.jpg') no-repeat center bottom; 
            background-size: cover; 
            position: relative; 
            overflow: hidden; 
            border: 4px solid #000; 
        }

        #personagem {
            position: absolute;
            bottom: 20px; /* Ajustado para alinhar ao chão */
            left: 50px;
            width: 100px;
            z-index: 2;
        }

        #ampulheta {
            position: absolute;
            bottom: 20px; /* Ajustado para alinhar ao chão */
            right: -50px; 
            width: 50px;
            z-index: 1;
        }

        .pular { animation: pulo 0.6s linear; }
        @keyframes pulo { 0% { bottom: 20px; } 30% { bottom: 140px; } 70% { bottom: 140px; } 100% { bottom: 20px; } }
        
        .mover-ampulheta { animation: mover 2s infinite linear; }
        @keyframes mover { 0% { right: -50px; } 100% { right: 850px; } }
    </style>
</head>

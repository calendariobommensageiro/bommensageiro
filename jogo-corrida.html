<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Bom Mensageiro: Beta 2.0</title>
    <style>
        /* Mantive seu alinhamento original para não perder o trabalho visual */
        body { margin: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; background: #333; }
        #jogo { width: 800px; height: 400px; background: url('cenariobeta.jpg'); background-size: cover; position: relative; overflow: hidden; border: 4px solid #000; }
        #personagem { position: absolute; bottom: 60px; left: 50px; width: 100px; }
        #ampulheta { position: absolute; bottom: 80px; right: -50px; width: 50px; }
        
        /* Adicionado para a UI não quebrar o layout */
        #ui { color: #fff; font-size: 24px; margin-bottom: 10px; font-weight: bold; }
        
        .pular { animation: pulo 0.6s linear; }
        @keyframes pulo { 0% { bottom: 60px; } 30% { bottom: 180px; } 70% { bottom: 180px; } 100% { bottom: 60px; } }
        .mover-ampulheta { animation: mover 2s infinite linear; }
        @keyframes mover { 0% { right: -50px; } 100% { right: 850px; } }
    </style>
</head>
<body>
    <div id="ui">Tempo: <span id="tempo">12:00</span> | Pontos: <span id="pontos">0</span></div>
    <div id="jogo">
        <img id="personagem" src="jogadorbeta.png" alt="Mensageiro">
        <img id="ampulheta" src="ampulhetabeta.png" class="mover-ampulheta" alt="Tempo">
    </div>
    <button onclick="iniciarJogo()" style="margin-top: 15px; padding: 10px 30px; cursor: pointer;">START</button>

    <script>
        const personagem = document.getElementById('personagem');
        const ampulheta = document.getElementById('ampulheta');
        let jogoAtivo = false;
        let segundos = 720;
        let pontuacao = 0;

        function iniciarJogo() {
            if(jogoAtivo) return; // Evita múltiplos starts
            jogoAtivo = true;
            // O resto da lógica de tempo e loop permanece aqui...
        }

        // A lógica de pulo e colisão que você já tinha alinhada permanece intacta
        document.addEventListener('keydown', (e) => {
            if ((e.code === 'Space' || e.code === 'ArrowUp') && jogoAtivo) {
                personagem.classList.add('pular');
                setTimeout(() => personagem.classList.remove('pular'), 600);
            }
        });
    </script>
</body>
</html>

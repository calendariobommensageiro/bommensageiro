<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Jogo Pega</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background-color: #000; }
        #game-container { 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
            background: url('cenariopega.png') no-repeat center bottom; 
            background-size: cover; 
        }
        #jogador { 
            position: absolute; 
            bottom: 20px; 
            left: 50%; 
            width: 250px; 
            transition: left 0.05s linear; 
        }
        .item { 
            position: absolute; 
            width: 100px; 
            z-index: 5;
        }
        #placar { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            color: white; 
            font-size: 32px; 
            font-weight: bold; 
            background: rgba(0,0,0,0.6); 
            padding: 15px; 
            border-radius: 10px; 
            z-index: 10;
        }
    </style>
</head>
<body>

<div id="placar">Pontos: 0</div>
<div id="game-container">
    <img id="jogador" src="jogadorpega.png" alt="Jogador">
</div>

<script>
    const jogador = document.getElementById('jogador');
    const container = document.getElementById('game-container');
    const placarEl = document.getElementById('placar');
    let posX = window.innerWidth / 2;
    let pontos = 0;
    
    let keys = {};
    window.addEventListener('keydown', (e) => keys[e.key] = true);
    window.addEventListener('keyup', (e) => keys[e.key] = false);

    function gameLoop() {
        if (keys['ArrowLeft'] && posX > 0) posX -= 15;
        if (keys['ArrowRight'] && posX < window.innerWidth - 250) posX += 15;
        jogador.style.left = posX + 'px';
        requestAnimationFrame(gameLoop);
    }
  // --- SUPORTE A TECLADO E TOQUE ---
    function mover(direcao, status) {
        if (direcao === 'left') keys['ArrowLeft'] = status;
        if (direcao === 'right') keys['ArrowRight'] = status;
    }

    // Eventos de Teclado
    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') mover('left', true);
        if (e.key === 'ArrowRight') mover('right', true);
    });
    window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft') mover('left', false);
        if (e.key === 'ArrowRight') mover('right', false);
    });

  // Eventos de Toque (Celular) - Modo Robusto
    window.addEventListener('touchstart', (e) => {
        e.preventDefault(); // Impede que o navegador tente rolar a página
        const metadeTela = window.innerWidth / 2;
        const toqueX = e.touches[0].clientX;
        
        if (toqueX < metadeTela) mover('left', true);
        else mover('right', true);
    }, {passive: false});

    window.addEventListener('touchend', (e) => {
        e.preventDefault();
        mover('left', false);
        mover('right', false);
    }, {passive: false});

    // --- LÓGICA DE CRIAÇÃO DE ITENS ---
    function criarItem() {
        const item = document.createElement('img');
        item.src = 'pergaminhopega.png';
        item.className = 'item';
        item.style.left = Math.random() * (window.innerWidth - 100) + 'px';
        let itemTop = 0;
        item.style.top = itemTop + 'px';
        container.appendChild(item);

        const cair = setInterval(() => {
            itemTop += 6;
            item.style.top = itemTop + 'px';

            const jogadorRect = jogador.getBoundingClientRect();
            const itemRect = item.getBoundingClientRect();

            if (itemRect.bottom >= jogadorRect.top && 
                itemRect.left < jogadorRect.right - 20 && 
                itemRect.right > jogadorRect.left + 20) {
                
                pontos++;
                placarEl.innerText = 'Pontos: ' + pontos;
                item.remove();
                clearInterval(cair);
            } else if (itemTop > window.innerHeight) {
                item.remove();
                clearInterval(cair);
            }
        }, 20);
    }
    setInterval(criarItem, 2000);

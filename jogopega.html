<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Jogo Pega</title>
 <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; background-color: #000; }
    #game-container { position: relative; width: 100vw; height: 100vh; background: url('cenariopega.png') no-repeat center bottom; background-size: cover; }
    
    #jogador { 
        position: absolute; 
        bottom: 20px; 
        left: 50%; 
        width: 150px; /* Personagem maior */
        transition: left 0.05s linear; 
    }
    
    .item { 
        position: absolute; 
        width: 100px; /* Pergaminho maior para facilitar a colisão */
        z-index: 5;
    }
    
    #placar { position: absolute; top: 20px; left: 20px; color: white; font-size: 32px; font-weight: bold; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 10px; }
</style>

<script>
    const jogador = document.getElementById('jogador');
    const container = document.getElementById('game-container');
    const placarEl = document.getElementById('placar');
    let posX = window.innerWidth / 2;
    let pontos = 0;
    
    // Movimentação mais fluida: permite segurar a seta
    let keys = {};
    window.addEventListener('keydown', (e) => keys[e.key] = true);
    window.addEventListener('keyup', (e) => keys[e.key] = false);

    function gameLoop() {
        if (keys['ArrowLeft'] && posX > 0) posX -= 15; // Velocidade ajustada
        if (keys['ArrowRight'] && posX < window.innerWidth - 150) posX += 15;
        jogador.style.left = posX + 'px';
        requestAnimationFrame(gameLoop);
    }
    gameLoop();

    function criarItem() {
        const item = document.createElement('img');
        item.src = 'pergaminhopega.png'; // Verifique se este é o nome real do arquivo
        item.className = 'item';
        item.style.left = Math.random() * (window.innerWidth - 100) + 'px';
        let itemTop = 0;
        item.style.top = itemTop + 'px';
        container.appendChild(item);

        const cair = setInterval(() => {
            itemTop += 6; // Velocidade de queda controlada
            item.style.top = itemTop + 'px';

            const jogadorRect = jogador.getBoundingClientRect();
            const itemRect = item.getBoundingClientRect();

            // Colisão facilitada
            if (itemRect.bottom >= jogadorRect.top && 
                itemRect.left < jogadorRect.right - 20 && 
                itemRect.right > jogadorRect.left + 20) {
                
                pontos++;
                placarEl.innerText = 'Pontos: ' + pontos;
                item.remove();
                clearInterval(cair);
            } else if (itemTop > window.innerHeight) {
                item.remove();
                clearInterval(cair);
            }
        }, 20);
    }
    setInterval(criarItem, 2000); // Pergaminhos caem um pouco mais devagar
</script>
</body>
</html>

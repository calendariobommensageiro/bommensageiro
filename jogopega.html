<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Jogo Pega</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; font-family: sans-serif; background-color: #000; }
        #game-container { 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
            background: url('cenariopega.png') no-repeat center bottom; 
            background-size: cover; 
        }
        #jogador { 
            position: absolute; 
            bottom: 20px; 
            left: 50%; 
            width: 250px; 
            transition: left 0.05s linear;
            pointer-events: none; /* Garante que o toque passe direto pelo boneco */
        }
        .item { 
            position: absolute; 
            width: 100px; 
            z-index: 5;
        }
        #placar { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            color: white; 
            font-size: 32px; 
            font-weight: bold; 
            background: rgba(0,0,0,0.6); 
            padding: 15px; 
            border-radius: 10px; 
            z-index: 10;
        }
    </style>
</head>
<body>

<div id="placar">Pontos: 0</div>
<div id="game-container">
    <img id="jogador" src="jogadorpega.png" alt="Jogador">
</div>

<button id="btnPause" style="position:fixed; top:10px; right:10px; z-index:100; padding:10px;">Pause / Play</button>

<script>
    // Variáveis de controle
    let estadoDoJogo = 'contagem'; // contagem, jogando, pausado, gameover
    let erros = 0;
    let recorde = localStorage.getItem('recordeJogo') || 0;

    // Função de Pause
    const btnPause = document.getElementById('btnPause');
    btnPause.addEventListener('click', () => {
        if (estadoDoJogo === 'jogando') estadoDoJogo = 'pausado';
        else if (estadoDoJogo === 'pausado') estadoDoJogo = 'jogando';
    });

    // Função que verifica o Game Over
    function verificarErro() {
        erros++;
        if (erros >= 5) {
            finalizarJogo();
        }
    }

    // Função de Finalização e Ranking
    function finalizarJogo() {
        estadoDoJogo = 'gameover';
        if (pontos > recorde) {
            recorde = pontos;
            localStorage.setItem('recordeJogo', recorde);
        }
        alert("GAME OVER! Sua pontuação: " + pontos + ". Recorde atual: " + recorde);
        location.reload(); // Reinicia
    }

    // No seu loop de queda (dentro do setInterval de criação):
    // Se (itemTop > window.innerHeight) { 
    //    item.remove(); 
    //    verificarErro(); 
    // }
</script>
</body>
</html>

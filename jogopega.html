<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Jogo Pega</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; font-family: sans-serif; background-color: #000; }
        #game-container { 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
            background: url('cenariopega.png') no-repeat center bottom; 
            background-size: cover; 
        }
        #jogador { 
            position: absolute; 
            bottom: 20px; 
            left: 50%; 
            width: 250px; 
            transition: left 0.05s linear;
            pointer-events: none; /* Garante que o toque passe direto pelo boneco */
        }
        .item { 
            position: absolute; 
            width: 100px; 
            z-index: 5;
        }
        #placar { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            color: white; 
            font-size: 32px; 
            font-weight: bold; 
            background: rgba(0,0,0,0.6); 
            padding: 15px; 
            border-radius: 10px; 
            z-index: 10;
        }
    </style>
</head>
<body>

<div id="placar">Pontos: 0</div>
<div id="game-container">
    <img id="jogador" src="jogadorpega.png" alt="Jogador">
</div>

<script>
    const jogador = document.getElementById('jogador');
    const container = document.getElementById('game-container');
    const placarEl = document.getElementById('placar');
    
    let posX = window.innerWidth / 2;
    let pontos = 0;
    let keys = { ArrowLeft: false, ArrowRight: false };

    // --- LÓGICA DE MOVIMENTO ---
    function gameLoop() {
        if (keys['ArrowLeft'] && posX > 0) {
            posX -= 15;
        }
        // O limite 250 garante que o jogador de 250px pare na borda direita
        if (keys['ArrowRight'] && posX < (window.innerWidth - 250)) {
            posX += 15;
        }
        jogador.style.left = posX + 'px';
        requestAnimationFrame(gameLoop);
    }
    gameLoop();

    // --- CONTROLE TECLADO ---
    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') keys['ArrowLeft'] = true;
        if (e.key === 'ArrowRight') keys['ArrowRight'] = true;
    });
    window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft') keys['ArrowLeft'] = false;
        if (e.key === 'ArrowRight') keys['ArrowRight'] = false;
    });

    // --- CONTROLE TOQUE (CELULAR) ---
    window.addEventListener('touchstart', (e) => {
        const metadeTela = window.innerWidth / 2;
        if (e.touches[0].clientX < metadeTela) {
            keys['ArrowLeft'] = true;
            keys['ArrowRight'] = false;
        } else {
            keys['ArrowRight'] = true;
            keys['ArrowLeft'] = false;
        }
    });
    window.addEventListener('touchend', () => {
        keys['ArrowLeft'] = false;
        keys['ArrowRight'] = false;
    });

    // --- LÓGICA DO PERGAMINHO ---
    function criarItem() {
        const item = document.createElement('img');
        item.src = 'pergaminhopega.png';
        item.className = 'item';
        item.style.left = Math.random() * (window.innerWidth - 100) + 'px';
        let itemTop = 0;
        item.style.top = itemTop + 'px';
        container.appendChild(item);

        const cair = setInterval(() => {
            itemTop += 6;
            item.style.top = itemTop + 'px';

            const jogadorRect = jogador.getBoundingClientRect();
            const itemRect = item.getBoundingClientRect();

            // Colisão
            if (itemRect.bottom >= jogadorRect.top && 
                itemRect.left < jogadorRect.right - 20 && 
                itemRect.right > jogadorRect.left + 20) {
                
                pontos++;
                placarEl.innerText = 'Pontos: ' + pontos;
                item.remove();
                clearInterval(cair);
            } else if (itemTop > window.innerHeight) {
                item.remove();
                clearInterval(cair);
            }
        }, 20);
    }
    setInterval(criarItem, 2000);
</script>
</body>
</html>

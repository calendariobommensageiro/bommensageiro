<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Jogo Pega</title>
  <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background-color: #000; }
        #game-container { 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
            background: url('cenariopega.png') no-repeat center bottom; 
            background-size: cover; 
        }
        /* Ajuste do Personagem */
        #jogador { 
            position: absolute; 
            bottom: 30px; 
            left: 50%; 
            width: 120px; /* Definindo um tamanho fixo visível */
            transition: left 0.1s; 
        }
        /* Ajuste do Pergaminho */
        .item { 
            position: absolute; 
            width: 60px; /* Tamanho fixo menor para não cobrir a tela */
            z-index: 5;
        }
        #placar { 
            position: absolute; 
            top: 10px; 
            left: 10px; 
            color: white; 
            font-size: 24px; 
            font-weight: bold; 
            background: rgba(0,0,0,0.5); 
            padding: 10px; 
            border-radius: 5px; 
            z-index: 20; 
        }
    </style>
</head>
<body>

<div id="placar">Pontos: 0</div>
<div id="game-container">
    <img id="jogador" src="jogadorpega.png" alt="Jogador">
</div>

<script>
    const jogador = document.getElementById('jogador');
    const container = document.getElementById('game-container');
    const placarEl = document.getElementById('placar');
    let posX = window.innerWidth / 2;
    let pontos = 0;

    // Movimentação por setas
    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' && posX > 50) posX -= 40;
        if (e.key === 'ArrowRight' && posX < window.innerWidth - 50) posX += 40;
        jogador.style.left = (posX - 50) + 'px';
    });

    function criarItem() {
        const item = document.createElement('img');
        item.src = 'pergaminhopega.png';
        item.className = 'item';
        item.style.left = Math.random() * (window.innerWidth - 60) + 'px';
        let itemTop = 0;
        item.style.top = itemTop + 'px';
        container.appendChild(item);

        const cair = setInterval(() => {
            itemTop += 5;
            item.style.top = itemTop + 'px';

            // Detecção de colisão
            const jogadorRect = jogador.getBoundingClientRect();
            const itemRect = item.getBoundingClientRect();

            if (itemRect.bottom >= jogadorRect.top && 
                itemRect.left < jogadorRect.right && 
                itemRect.right > jogadorRect.left &&
                itemRect.top < jogadorRect.bottom) {
                
                pontos++;
                placarEl.innerText = 'Pontos: ' + pontos;
                item.remove();
                clearInterval(cair);
            } else if (itemTop > window.innerHeight) {
                item.remove();
                clearInterval(cair);
            }
        }, 20);
    }

    setInterval(criarItem, 1500);
</script>
</body>
</html>
